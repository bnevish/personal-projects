name: Naukri Profile Updater

on:
  # 6 times a day timed just before recruiter peak hours (IST = UTC+5:30)
  schedule:
    - cron: "15 3 * * *"   #  8:45 AM IST — before morning rush
    - cron: "15 6 * * *"   # 11:45 AM IST — late morning spike
    - cron: "15 8 * * *"   #  1:45 PM IST — post-lunch sourcing
    - cron: "15 10 * * *"  #  3:45 PM IST — afternoon peak (most searches)
    - cron: "15 12 * * *"  #  5:45 PM IST — evening browsing
    - cron: "30 13 * * *"  #  7:00 PM IST — late searches

  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          sudo env "PATH=$PATH" python -m playwright install-deps chromium

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run Naukri updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: xvfb-run python naukri_updater.py

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run_log.txt
            login_failed.png
          retention-days: 1

